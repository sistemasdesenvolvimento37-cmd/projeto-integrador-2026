
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Fila do Banho</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <header class="topbar">

            <a class="brand" href="index.html">
                FILA DO BANHO
            </a>

            <a href="login.html">Login</a>

        </header>

        <main>

            <section class="card form-card">

                <div class="avatar">＋</div>

                <h1>Cadastre-se</h1>

                <form action="menu.html">

                    <div class="field">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>

                    <div class="field">

                        <label for="usuario">
                            Usuário
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Crie seu usuário"
                            required
                        >

                    </div>

                    <div class="field">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie sua senha"
                            required
                        >

                    </div>

                    <button class="btn full" type="submit">
                        Cadastrar
                    </button>

                </form>

                <p class="form-foot">
                    Já tem uma conta?
                    <a href="login.html">Faça login</a>
                </p>

            </section>

        </main>

    </div>

</body>
</html>
