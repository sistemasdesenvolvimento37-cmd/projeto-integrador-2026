
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar horário | Fila do Banho</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <header class="topbar">

            <a class="brand" href="menu.html">
                FILA DO BANHO
            </a>

            <a href="menu.html">Menu</a>

        </header>

        <main>

            <section class="card form-wide">

                <h1>Reservar horário</h1>

                <form action="horarios.html">

                    <div class="field">

                        <label for="turma">
                            Turma
                        </label>

                        <select id="turma" name="turma">

                            <option>1º Ano</option>

                            <option>2º Ano</option>

                            <option>3º Ano</option>

                        </select>

                    </div>

                    <div class="field">

                        <label for="horario">
                            Horário
                        </label>

                        <select id="horario" name="horario">

                            <option>11:50–12:50</option>

                            <option>11:30–11:40</option>

                            <option>12:10–12:20</option>
                            <option>12:20-12:30</option>
                            <option>12:30-12:40</option>
                            <option>12:40-12:50</option>

                        </select>

                    </div>

                    <button class="btn" type="submit">
                        Verificar disponibilidade
                    </button>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
